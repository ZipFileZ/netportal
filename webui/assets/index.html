<script>
// In demo mode, show script errors on the page to make problems visible.
window.addEventListener('error', function (e) {
  if (!window.NP_BOOT || !window.NP_BOOT.demo) return;
  var d = document.createElement('pre');
  d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:999;margin:0;padding:8px;background:#400;color:#fff;font:12px Consolas;white-space:pre-wrap';
  d.textContent = 'JS error: ' + e.message + ' @ ' + e.lineno + ':' + e.colno;
  (document.body || document.documentElement).appendChild(d);
});
</script>
